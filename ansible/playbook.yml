---
- name: Verify Flask API Deployment
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    app_url: "http://3.27.107.127:5000"
    expected_version: "2.0.0"

  tasks:
    - name: Check API health endpoint
      uri:
        url: "{{ app_url }}/health"
        method: GET
        status_code: 200
      register: health_response

    - name: Print health status
      debug:
        msg: "Health: {{ health_response.json.status }} | Uptime: {{ health_response.json.uptime_seconds }}s"

    - name: Check root endpoint
      uri:
        url: "{{ app_url }}/"
        method: GET
        status_code: 200
      register: root_response

    - name: Verify correct version is deployed
      assert:
        that:
          - root_response.json.version == expected_version
        fail_msg: "Wrong version! Expected {{ expected_version }}, got {{ root_response.json.version }}"
        success_msg: "Version {{ expected_version }} deployed successfully!"

    - name: Print deployment info
      debug:
        msg: "Framework: {{ root_response.json.framework }} | Version: {{ root_response.json.version }}"