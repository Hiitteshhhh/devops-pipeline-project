---
- name: Verify Flask API Deployment
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Check API health endpoint
      uri:
        url: "{{ app_url }}/health"
        method: GET
        status_code: 200
      register: health_response

    - name: Print health status
      debug:
        msg: "Health: {{ health_response.json.status }} | Uptime: {{ health_response.json.uptime_seconds }}s"

    - name: Check root endpoint
      uri:
        url: "{{ app_url }}/"
        method: GET
        status_code: 200
      register: root_response

    - name: Print deployment info
      debug:
        msg: "Framework: {{ root_response.json.framework }} | Version: {{ root_response.json.version }}"