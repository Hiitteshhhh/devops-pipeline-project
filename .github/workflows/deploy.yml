name: Deploy Flask API to AWS ECS

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ap-southeast-2
  ECR_REPOSITORY: flask-devops-api
  ECS_CLUSTER: devops-flask-cluster
  ECS_SERVICE: flask-api-service
  CONTAINER_NAME: flask-devops-api

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag and push Docker image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./app
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Download task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition flask-devops-api \
            --query taskDefinition > task-definition.json

      - name: Update ECS task definition with new image
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: Install Ansible and boto3
        run: pip install ansible boto3 botocore

      - name: Wait for ECS service to stabilize
        run: sleep 60

      - name: Get ECS task public IP
        run: |
          TASK_ARN=$(aws ecs list-tasks --cluster devops-flask-cluster --region ap-southeast-2 --query 'taskArns[0]' --output text)
          ENI_ID=$(aws ecs describe-tasks --cluster devops-flask-cluster --region ap-southeast-2 --tasks $TASK_ARN --query 'tasks[0].attachments[0].details[?name==`networkInterfaceId`].value' --output text)
          PUBLIC_IP=$(aws ec2 describe-network-interfaces --network-interface-ids $ENI_ID --region ap-southeast-2 --query 'NetworkInterfaces[0].Association.PublicIp' --output text)
          echo "APP_URL=http://$PUBLIC_IP:5000" >> $GITHUB_ENV
          echo "Deployed at http://$PUBLIC_IP:5000"

      - name: Run Ansible playbook to verify deployment
        run: |
          ansible-playbook ansible/playbook.yml --extra-vars "app_url=${{ env.APP_URL }}"